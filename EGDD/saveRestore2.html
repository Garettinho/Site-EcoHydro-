<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save e Restore</title>
</head>
<body>
    <canvas id="meu_canvas" width="1500" height="700"></canvas>
    <script>
  

   var canvas=document.getElementById('meu_canvas')
   var context=canvas.getContext('2d')

   
   context.fillStyle='green';
   context.fillRect(50, 90, 25, 25);
   context.save();

   context.fillStyle='purple';
   context.fillRect(80, 90, 25, 25);
   context.save();

   context.fillStyle='blue';
   context.fillRect(110, 90, 25, 25);
   context.save();

   context.fillStyle='black';
   context.fillRect(140, 90, 25, 25);
 
   context.restore();
   context.restore();
   context.restore();
   context.fillRect(170,90,25,25);




    </script>
</body>
</html>
