<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
        canvas {
            border: 2px solid rgb(185, 41, 152);
        }
    </style>
<body>
    <canvas id="meu_canvas" width="400" height="400"></canvas>
    <script>
        // Canvas e contexto
       let canvas=document.getElementById('meu_canvas');
       let context=canvas.getContext('2d')

       // Primeiro arco
       // Novo path
       context.beginPath();
       // Desenha 
       context.arc(50, 50, 40, 90*Math.PI/180, 270*Math.PI/180, false);
       // Preenchimento
       context.fill();
       // Contorno
       context.stroke();

       // Segundo arco
       context.beginPath()
       context.arc(150, 50, 40, 90*Math.PI/180, 270*Math.PI/180, true);
       context.fill();
       context.stroke();

       // Cincunferencia completa 
       context.beginPath();
       context.arc(250, 50, 40, 0, 2*Math.PI);
       context.fill();
       context.stroke();

       // 1/4
       context.beginPath();
       context.moveTo(350, 50);
       context.arc(350, 50, 40, 90*Math.PI/180, 0, true);
       context.fill();
       
       context.stroke();
       </script>
</body>
</html>
