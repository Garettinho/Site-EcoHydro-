<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Movimento Personagem</title>
    <style>
        canvas {
            border: 2px solid rgb(0, 0, 0);
        }
    </style>
    <script src="./js/spritesheet.js"></script>
    <script src="./js/animacao1.js"></script>
    <script src="./js/Teclado.js"></script>
    <script src="./js/sonic.js"></script>
</head>

<body>
    <canvas id="meuCanvas" width="1468" height="708"></canvas>
    <script>
        let canvas = document.getElementById('meuCanvas');
        let context = canvas.getContext('2d');

        let teclado = new Teclado(document);
        let animacao = new Animacao(context);

        let imgSonic = new Image();
        imgSonic.src = './IMG/Sonic.png';

        let sonic = new Sonic(context, teclado, imgSonic);
        sonic.x = 0;
        sonic.y = 200;
        animacao.novoSprite(sonic);

        imgSonic.onload = function () {
            animacao.ligar();
        }


    </script>
</body>

</html>
