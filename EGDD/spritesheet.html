<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spritesheet</title>
    <style>
        canvas{
            border: 2px solid rgb(0, 0, 0);
        }
    </style>
    <script src="./js/spritesheet.js"></script>
</head>
<body>
    <canvas id="meuCanvas" width="1468" height="708"></canvas>
      <script>
        let canvas = document.getElementById('meuCanvas');
        let context = canvas.getContext('2d');

        let imgSonic = new Image();
        imgSonic.src = './IMG/sonic.png';
        
        let recorte = new Spritesheet(context, imgSonic, 3, 8);
        recorte.intervalo = 60;
        recorte.linha = 1;
        imgSonic.onload = gameLoop;
        

        function gameLoop(){
            context.clearRect(0, 0, context.canvas.width, context.canvas.height);
            recorte.proximoQuadro();
            recorte.desenhar(200, 100);
            requestAnimationFrame(gameLoop);
        }
    </script>  
</body>
</html>
