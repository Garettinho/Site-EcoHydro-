<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arco</title>
</head>
<style>
        canvas {
            border: 2px solid rgb(185, 41, 152);
        }
    </style>
<body>
    <canvas id="meu_canvas" width="300" height="300"></canvas>
    <script>
        //Canvas e contexto
       let canvas=document.getElementById('meu_canvas');
       let context=canvas.getContext('2d')

       context.beginPath();
       context.arc(
            50,                     // X
            50,                    // Y
            40,                   // raio
            90*Math.PI/180,      // inicio
            270*Math.PI/180,    //  termino
            false              //   sentido
        );
        context.stroke(); 
        </script>
</body>
</html>
