<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação Teste</title>
    <style>
        canvas{
            border: 2px solid black;
        }
    </style>
    <script src="/EGDD/JS/animacao1.js"></script>
    <script src="/EGDD/JS/bola.js"></script>
</head>
<body>
    <canvas id="canvas" width="1509" height="714"></canvas>
    <script>
     let canvas=document.getElementById('canvas');
     let context= canvas.getContext('2d');

       let b1= new Bola (context);

     b1.x=100;
     b1.y=180;
     b1.velocidadeX=2;
     b1.velocidadeY= -10;
     b1.cor='red';
     b1.raio=20;

     let b3= new Bola (context);
        b3.x=200;
     b3.y=230;
     b3.velocidadeX=2;
     b3.velocidadeY= -10;
     b3.cor='purple';
     b3.raio=20;
     
let b2= new Bola (context);
        b2.x=150;
     b2.y=250;
     b2.velocidadeX=2;
     b2.velocidadeY= -10;
     b2.cor='blue';
     b2.raio=20;

       let b4= new Bola (context);
     b4.x=250;
     b4.y=150;
     b4.velocidadeX=2;
     b4.velocidadeY= -10;
     b4.cor='green';
     b4.raio=20;

     let animacao= new Animacao (context);
     animacao.novoSprite(b1);
     animacao.novoSprite(b2);
     animacao.novoSprite(b3);
     animacao.novoSprite(b4);
     animacao.ligar();
     
    </script>
</body>
</html>
