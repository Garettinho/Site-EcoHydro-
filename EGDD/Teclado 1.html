<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Exemplo 1 - Teclado</title> 
</head> 
<body> 
    <canvas id="canvas_teclado_1" width="800" height="500"></canvas> 
<script> 

let canvas=document.getElementById('canvas_teclado_1'); 
let context=canvas.getContext('2d') 
let posicao=0; 
desenharPersonagem(); 
        document.addEventListener('keydown', function(evento){ 
          if(evento.keyCode == 37){ 
            posicao -=10; 
          } 
          else if(evento.keyCode == 39){ 
            posicao += 10; 
            desenharPersonagem(); 
          } 

        }); 
        function desenharPersonagem(){ 
            context.clearRect(0,0, canvas.width, canvas.height); 
            context.fillRect(posicao, 100, 200, 50); 
        } 

    </script> 

</body> 

</html>
